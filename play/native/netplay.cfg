# RetroArch netplay settings for the PS1 game club.
# Loaded with --appendconfig by host.sh / join.sh / host.ps1 / join.ps1, so it only
# overrides these keys for that run and leaves your normal retroarch.cfg alone.
# Keys that your RetroArch version does not know are ignored.

# Your name as shown to the other players. The helper scripts also pass --nick.
netplay_nickname = "Player"

# The host listens on this port (TCP). Forward it on your router for internet play.
netplay_ip_port = "55435"

# Input latency. Higher numbers hide more network delay but make buttons feel slower.
# 2 to 4 frames is comfortable on a home network. Raise range for internet play.
netplay_input_latency_frames_min = "2"
netplay_input_latency_frames_range = "3"

# Check that both sides still show the same game state every N frames (0 = off).
# Useful while testing; costs a little speed.
netplay_check_frames = "600"

# Let the host open its port through the router automatically when the router supports UPnP.
netplay_nat_traversal = "true"

# Do not list this game on the public RetroArch lobby.
netplay_public_announce = "false"

# Do not send everything through a RetroArch relay server unless you turn this on.
netplay_use_mitm_server = "false"

# Allow more players than the game's own player count to watch or take over slots.
netplay_allow_slaves = "true"
netplay_require_slaves = "false"
netplay_allow_pausing = "true"

# Join as a player, not a spectator.
netplay_start_as_spectator = "false"
